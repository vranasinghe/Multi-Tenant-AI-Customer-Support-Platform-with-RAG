name: CI

# Deterministic checks for every pull request. Offline providers (demo LLM, hash embeddings) and
# credentials generated for the run: no provider key is configured or needed. Each job has its own
# runner, so no two jobs share a database, Redis or a port. The hardware-sensitive latency gate is
# in performance.yml. What each job proves: docs/DEVELOPMENT.md, "Continuous integration".

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.9"

jobs:
  # ------------------------------------------------------------------ TypeScript
  web:
    name: Web & widget (format, lint, types, unit tests, builds, bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Build-time placeholders only; not secrets.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build # includes the widget's gzip budget
      - name: The committed widget bundle is the one these sources build
        run: git diff --exit-code -- services/api/widget_assets

  # ------------------------------------------------------------------ Python, static
  api-static:
    name: API (ruff, format, strict mypy, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --junitxml=unit.xml
      - name: No unit test may skip
        run: python3 ../../scripts/ci/check_junit.py unit.xml --min-tests 700

  # ------------------------------------------------------------------ Real services
  integration:
    name: Backend suite, real workers, migrations, RLS, runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [api-static]
    env:
      COMPOSE_PROJECT_NAME: acs-ci
      COMPOSE_ENV_FILES: ${{ github.workspace }}/ci.env
      ARTIFACTS: ${{ github.workspace }}/ci-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
        working-directory: services/api
      - run: bash scripts/ci/make-env.sh ci.env
      - run: bash scripts/ci/up.sh
      - run: bash scripts/ci/migrations.sh
      - name: Full backend suite (only the proxy tests may skip here)
        run: bash scripts/ci/backend-suite.sh
      - name: Runtime image and the 17 proxy tests (none may skip)
        run: bash scripts/ci/runtime-proxy.sh
      - name: Backup and restore rehearsal
        run: bash scripts/ci/restore-rehearsal.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 500 > "$ARTIFACTS/services.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: integration-artifacts
          path: ci-artifacts/
          retention-days: 7
      - if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ Browser
  browser:
    name: Stack smoke test and browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [web, api-static]
    env:
      COMPOSE_PROJECT_NAME: acs-ci
      COMPOSE_ENV_FILES: ${{ github.workspace }}/ci.env
      ARTIFACTS: ${{ github.workspace }}/ci-artifacts
      PNPM: pnpm
      E2E_BROWSER_CHANNEL: "" # Playwright's Chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @acs/web exec playwright install --with-deps chromium
      - run: bash scripts/ci/make-env.sh ci.env
      - run: bash scripts/ci/up.sh web
      - run: bash scripts/ci/browser.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 500 > "$ARTIFACTS/services.log"
      # Traces and screenshots hold only the synthetic accounts created by the journeys.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: browser-artifacts
          path: |
            ci-artifacts/
            apps/web/test-results/
          retention-days: 7
      - if: always()
        run: docker compose down -v
