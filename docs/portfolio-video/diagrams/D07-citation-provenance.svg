="round" marker-end="url(#m-sync)"/></g><g id="step-6"><text x="96" y="800" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#EF4444" text-anchor="start" >Before: [3] was accepted</text><text x="96" y="838" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="start" >although the model never saw Passage C.</text><text x="96" y="890" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#F59E0B" text-anchor="start" >Provenance, not correctness: a kept</text><text x="96" y="918" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#F59E0B" text-anchor="start" >citation may still not support the sentence.</text></g>
