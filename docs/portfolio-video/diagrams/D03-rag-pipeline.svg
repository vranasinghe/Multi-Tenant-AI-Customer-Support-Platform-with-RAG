roke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/><path d="M 514 640 L 514 700 L 728 700 L 728 740" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/><rect x="150" y="750" width="300" height="110" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="300.0" y="798.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Vector search</text><text x="300.0" y="824.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >closeness of embeddings</text><rect x="578" y="750" width="300" height="110" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="728.0" y="798.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Keyword search</text><text x="728.0" y="824.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >matching words</text><rect x="364" y="885" width="300" height="80" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="514.0" y="931.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Rank fusion (k = 60)</text><path d="M 300 860 L 300 925 L 364 925" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/><path d="M 728 860 L 728 925 L 664 925" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-14"><rect x="1000" y="730" width="824" height="235" rx="16" fill="#111827" stroke="#F59E0B" stroke-width="2"/><text x="1030" y="775" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="start" >What is and is not established</text><text x="1030" y="815" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start" >Answer-bearing Recall@5: 85% (68/80) against a 90% target</text><text x="1030" y="847" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="start" >Offline hash baseline: matches words, has no semantic knowledge</text><text x="1030" y="879" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#22C55E" text-anchor="start" >Citation provenance: enforced (the source was shown to the model)</text><text x="1030" y="911" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#F59E0B" text-anchor="start" >Semantic citation correctness: unverified</text><text x="1030" y="943" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#F59E0B" text-anchor="start" >Real-model accuracy and faithfulness: not measured</text></g>
