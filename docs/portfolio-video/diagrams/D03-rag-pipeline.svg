ound" marker-end="url(#m-sync)"/></g><text x="96" y="480" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#38BDF8" text-anchor="start" >ANSWERING · request</text><g id="step-7"><rect x="96" y="500" width="252" height="140" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="222.0" y="564.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Question</text><text x="222.0" y="590.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >one org, one bot</text></g><g id="step-8"><rect x="388" y="500" width="252" height="140" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="514.0" y="564.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Retrieve</text><text x="514.0" y="590.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >vector + keyword</text><path d="M 348 570 L 384 570" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-9"><rect x="680" y="500" width="252" height="140" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="806.0" y="564.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Assemble prompt</text><text x="806.0" y="590.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >only what fits</text><path d="M 640 570 L 676 570" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-10"><rect 