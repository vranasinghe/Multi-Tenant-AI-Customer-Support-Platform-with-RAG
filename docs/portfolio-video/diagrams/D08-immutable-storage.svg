<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Immutable, fenced object publication</title>
<defs><marker id="m-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-sse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker><marker id="m-job" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="m-db" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFFFFF"/></marker><marker id="m-obj" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker><marker id="m-ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22C55E"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EF4444"/></marker></defs>
<rect width="1920" height="1080" fill="#080C14"/>
<g id="heading"><text x="96" y="100" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" >Immutable, fenced object publication</text><text x="96" y="142" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#94A3B8" text-anchor="start" >An object write cannot join a database transaction, so ownership is decided at publish</text><rect x="1592" y="62" width="232" height="40" rx="20" fill="#080C14" stroke="#38BDF8" stroke-width="2"/><text x="1708.0" y="89" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">FROM SOURCE CODE</text></g>
<g id="step-1"><rect x="96" y="280" width="384" height="170" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="288.0" y="344.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1 · Stage</text><text x="288.0" y="373.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >record the new key</text><text x="288.0" y="402.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >“delete unless published”</text></g><g id="step-2"><rect x="544" y="280" width="384" height="170" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="736.0" y="344.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2 · Upload</text><text x="736.0" y="373.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >new object every time</text><text x="736.0" y="402.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >…/g-{id}/original</text><path d="M 480 365 L 540 365" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-obj)"/></g><g id="step-3"><rect x="992" y="280" width="384" height="170" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="1184.0" y="344.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3 · Publish</text><text x="1184.0" y="373.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >fenced transaction:</text><text x="1184.0" y="402.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >chunks + new key</text><path d="M 928 365 L 988 365" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-db)"/></g><g id="step-4"><rect x="1440" y="280" width="384" height="170" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="1632.0" y="344.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4 · Purge</text><text x="1632.0" y="373.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >old object queued,</text><text x="1632.0" y="402.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >then removed</text><path d="M 1376 365 L 1436 365" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-db)"/></g><g id="step-5"><rect x="544" y="580" width="832" height="130" rx="16" fill="#111827" stroke="#EF4444" stroke-width="2"/><text x="960.0" y="638.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Stale attempt A resumes after attempt B published</text><text x="960.0" y="666.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle" >it no longer owns the job → publication refused</text><path d="M 1184 580 L 1184 450" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-bad)"/><rect x="544" y="750" width="832" height="100" rx="16" fill="#111827" stroke="#22C55E" stroke-width="2"/><text x="960.0" y="793.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Its object is reclaimed later</text><text x="960.0" y="821.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle" >B’s original and chunks stay unchanged</text><path d="M 960 710 L 960 750" fill="none" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/></g><g id="step-6"><text x="96" y="940" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#EF4444" text-anchor="start" >Before: one fixed key per page, so A could overwrite B’s stored HTML.</text><text x="96" y="975" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#22C55E" text-anchor="start" >After: 20 of 20 ownership tests pass; three also against real object storage.</text></g>
<g id="footnote"><text x="96" y="1050" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start" >Source: app/rag/originals.py, app/rag/storage.py; docs/mvp-improvement/A5_1_INGESTION_INTEGRITY_REPORT.md.</text></g>
</svg>
