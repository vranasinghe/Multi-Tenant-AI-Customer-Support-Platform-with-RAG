<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Backup and restore rehearsal</title>
<defs><marker id="m-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-sse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker><marker id="m-job" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="m-db" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFFFFF"/></marker><marker id="m-obj" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker><marker id="m-ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22C55E"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EF4444"/></marker></defs>
<rect width="1920" height="1080" fill="#080C14"/>
<g id="heading"><text x="96" y="100" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" >Backup and restore rehearsal</text><text x="96" y="142" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#94A3B8" text-anchor="start" >A backup counts once it has been restored</text><rect x="1592" y="62" width="232" height="40" rx="20" fill="#080C14" stroke="#22C55E" stroke-width="2"/><text x="1708.0" y="89" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#22C55E" text-anchor="middle" letter-spacing="1">MEASURED · LOCAL</text></g>
<g id="step-1"><rect x="96" y="280" width="360" height="200" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="276.0" y="360.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Source stack</text><text x="276.0" y="389.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >writers and storage</text><text x="276.0" y="418.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >stopped (quiesced)</text></g><g id="step-2"><rect x="560" y="250" width="360" height="110" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="740.0" y="299.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Database dump</text><text x="740.0" y="328.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >compressed SQL</text><rect x="560" y="390" width="360" height="110" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="740.0" y="439.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Document archive</text><text x="740.0" y="468.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >+ SHA-256 checksums</text><path d="M 456 330 L 560 305" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-db)"/><path d="M 456 430 L 560 445" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-obj)"/></g><g id="step-3"><rect x="1024" y="280" width="340" height="200" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="1194.0" y="360.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Restore</text><text x="1194.0" y="389.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >into empty volumes only</text><text x="1194.0" y="418.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >all-or-nothing</text><path d="M 920 305 L 1024 340" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-db)"/><path d="M 920 445 L 1024 420" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-obj)"/></g><g id="step-4"><rect x="1468" y="280" width="356" height="200" rx="16" fill="#111827" stroke="#22C55E" stroke-width="2"/><text x="1646.0" y="345.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >verify-data</text><text x="1646.0" y="374.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >counts and hashes,</text><text x="1646.0" y="403.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >policies, grants:</text><text x="1646.0" y="432.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >identical</text><path d="M 1364 380 L 1468 380" fill="none" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/></g><g id="step-5"><rect x="1024" y="560" width="800" height="130" rx="16" fill="#111827" stroke="#22C55E" stroke-width="2"/><text x="1424.0" y="618.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" >The restored app answered the same</text><text x="1424.0" y="647.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >sign-in · transcript · retrieval results · inbox</text><path d="M 1646 480 L 1646 560" fill="none" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/></g><g id="step-6"><rect x="96" y="560" width="824" height="130" rx="16" fill="#111827" stroke="#EF4444" stroke-width="2"/><text x="508.0" y="618.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Defect found by the rehearsal, then fixed</text><text x="508.0" y="647.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >the restored database regained DELETE rights the source had revoked</text></g><g id="step-7"><text x="96" y="790" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" >22 conversations, 32 messages, 6 chunks · backup 3 s · restore + verify 25 s</text><text x="96" y="828" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#F59E0B" text-anchor="start" >Tiny synthetic data: no recovery-time claim.</text><text x="96" y="890" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#F59E0B" text-anchor="start" >Not covered: off-site copies, point-in-time recovery, alerting, production-sized data,</text><text x="96" y="920" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#F59E0B" text-anchor="start" >production Compose file.</text></g><g id="legend"><line x1="96" y1="1000" x2="152" y2="1000" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><text x="166" y="1006" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" >Database transaction</text><line x1="376" y1="1000" x2="432" y2="1000" stroke="#A78BFA" stroke-width="4" stroke-linecap="round"/><text x="446" y="1006" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" >Private object storage</text><line x1="674" y1="1000" x2="730" y2="1000" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/><text x="744" y="1006" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" >Verified</text></g>
<g id="footnote"><text x="96" y="1050" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start" >Source: deploy/backup.sh, deploy/restore.sh, docs/RECOVERY.md, evidence/MILESTONE-A-FINAL/final/ci/restore/summary.log.</text></g>
</svg>
