<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Widget initialization lifecycle</title>
<defs><marker id="m-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-sse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker><marker id="m-job" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="m-db" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFFFFF"/></marker><marker id="m-obj" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker><marker id="m-ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22C55E"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EF4444"/></marker></defs>
<rect width="1920" height="1080" fill="#080C14"/>
<g id="heading"><text x="96" y="100" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" >Widget initialization lifecycle</text><text x="96" y="142" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#94A3B8" text-anchor="start" >Safe to install twice, safe to remove, safe to bring back</text><rect x="1592" y="62" width="232" height="40" rx="20" fill="#080C14" stroke="#38BDF8" stroke-width="2"/><text x="1708.0" y="89" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">FROM SOURCE CODE</text></g>
<g id="step-1"><rect x="96" y="260" width="300" height="130" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="246.0" y="319.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Script tag</text><text x="246.0" y="348.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >data-bot-key</text></g><g id="step-2"><rect x="500" y="260" width="360" height="130" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="680.0" y="319.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Page-wide registry</text><text x="680.0" y="348.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >shared by every loader copy</text><path d="M 396 325 L 500 325" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-3"><rect x="964" y="250" width="400" height="150" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="1164.0" y="305.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Identity</text><text x="1164.0" y="334.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >API origin · page origin</text><text x="1164.0" y="363.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >bot key · instance key</text><path d="M 860 325 L 964 325" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-4"><rect x="1468" y="190" width="356" height="110" rx="16" fill="#111827" stroke="#22C55E" stroke-width="2"/><text x="1646.0" y="239.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Exists</text><text x="1646.0" y="268.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >keep the same one</text><rect x="1468" y="350" width="356" height="130" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="1646.0" y="395.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >New</text><text x="1646.0" y="424.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >1 iframe · 1 listener</text><text x="1646.0" y="453.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >per-mount nonce</text><path d="M 1364 300 L 1416 300 L 1416 245 L 1468 245" fill="none" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/><path d="M 1364 345 L 1416 345 L 1416 415 L 1468 415" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-5"><rect x="1468" y="570" width="356" height="150" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="1646.0" y="610.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Inside the frame</text><text x="1646.0" y="639.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >bootstrap or resume</text><text x="1646.0" y="668.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >chat over SSE</text><text x="1646.0" y="697.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >token stays in memory</text><path d="M 1646 480 L 1646 570" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-6"><rect x="964" y="580" width="400" height="130" rx="16" fill="#111827" stroke="#F59E0B" stroke-width="2"/><text x="1164.0" y="625.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >destroy()</text><text x="1164.0" y="654.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >removes frame and listener</text><text x="1164.0" y="683.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >ends its requests</text><path d="M 1468 645 L 1364 645" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-7"><rect x="500" y="580" width="360" height="130" rx="16" fill="#111827" stroke="#22C55E" stroke-width="2"/><text x="680.0" y="639.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Mount again</text><text x="680.0" y="668.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >conversation resumes</text><path d="M 964 645 L 860 645" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sync)"/></g><g id="step-8"><text x="96" y="830" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="start" >forget: true asks the frame to delete the resume entry first; after 5 s without an answer</text><text x="96" y="860" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#F59E0B" text-anchor="start" >the widget is removed anyway and the entry may remain.</text><text x="96" y="920" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="start" >A cut-off answer is stored as interrupted and its reserved usage stays charged.</text><text x="96" y="960" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start" >Loader: 5,248 gzip bytes of a 10,240 budget · tested in Chrome with localhost origins only</text></g>
<g id="footnote"><text x="96" y="1050" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start" >Source: apps/widget/src/lifecycle.ts, loader.ts, panel.ts; docs/WIDGET_DEPLOYMENT.md; widget_assets/v1/manifest.json.</text></g>
</svg>
