<g id="heading"><text x="96" y="100" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" >Multi-tenant isolation</text><text x="96" y="142" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#94A3B8" text-anchor="start" >One shared platform, independent layers that each keep organizations apart</text><rect x="1592" y="62" width="232" height="40" rx="20" fill="#080C14" stroke="#38BDF8" stroke-width="2"/><text x="1708.0" y="89" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">FROM SOURCE CODE</text></g>
<g id="step-1"><rect x="96" y="190" width="560" height="240" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="376" y="235" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Northwind Outdoor</text><rect x="120" y="265" width="160" height="135" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="200.0" y="326.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Chatbot</text><text x="200.0" y="351.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >fictional</text><rect x="296" y="265" width="160" height="135" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="376.0" y="314.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Documents</text><text x="376.0" y="339.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >own chunks</text><text x="376.0" y="364.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >own originals</text><rect x="472" y="265" width="160" height="135" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="552.0" y="325.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Conversations</text><text x="552.0" y="350.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >own history</text><rect x="1264" y="190" width="560" height="240" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="1544" y="235" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Bluepeak Fitness</text><rect x="1288" y="265" width="160" height="135" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="1368.0" y="326.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Chatbot</text><text x="1368.0" y="351.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >fictional</text><rect x="1464" y="265" width="160" height="135" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="1544.0" y="314.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Documents</text><text x="1544.0" y="339.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >own chunks</text><text x="1544.0" y="364.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >own originals</text><rect x="1640" y="265" width="160" height="135" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="1720.0" y="325.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Conversations</text><text x="1720.0" y="350.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="middle" >own history</text></g><g id="step-2"><rect x="420" y="470" width="1080" height="74" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="450" y="515" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" >1 · Server-side session</text><text x="1470" y="515" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="end" >who is asking</text></g><g id="step-3"><rect x="420" y="562" width="1080" height="74" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="450" y="607" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" >2 · Membership and role</text><text x="1470" y="607" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="end" >owner · admin · agent · viewer — non-members get 404</text></g><g id="step-4"><rect x="420" y="654" width="1080" height="74" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="450" y="699" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" >3 · Organization-scoped queries</text><text x="1470" y="699" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="end" >org id in every statement and storage key</text></g><g id="step-5"><rect x="420" y="746" width="1080" height="74" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="450" y="791" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" >4 · PostgreSQL FORCE row-level security</text><text x="1470" y="791" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="end" >runtime role cannot bypass it</text></g><g id="step-6"><rect x="420" y="850" width="520" height="90" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="680.0" y="889.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Northwind rows</text><text x="680.0" y="915.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >visible to Northwind only</text><rect x="980" y="850" width="520" height="90" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="1240.0" y="889.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Bluepeak rows</text><text x="1240.0" y="915.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >visible to Bluepeak only</text></g><g id="step-7"><path d="M 1544 430 L 1544 599 L 1500 599" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-bad)"/><text x="1560" y="640" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#EF4444" text-anchor="start" >Bluepeak owner asks</text><text x="1560" y="668" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#EF4444" text-anchor="start" >for Northwind data</text><text x="1560" y="706" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="start" >404 · stops at layer 2</text></g>
<g id="footnote"><text x="96" y="1050" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8" text-anchor="start" >Source: app/api/deps.py, app/services/tenancy/policy.py, app/core/rls.py. The 404 was reproduced while recording (R14). Not a security certification.</text></g>
