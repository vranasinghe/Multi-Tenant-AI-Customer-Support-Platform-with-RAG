rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="620.0" y="407.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >crawl</text><rect x="500" y="470" width="240" height="80" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="620.0" y="517.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >default</text><rect x="500" y="640" width="240" height="80" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/><text x="620.0" y="687.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >maintenance</text><path d="M 356 395 L 430 395 L 430 290 L 500 290" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/><path d="M 356 395 L 430 395 L 430 400 L 500 400" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/><path d="M 396 600 L 460 600 L 460 510 L 500 510" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/><path d="M 396 690 L 430 690 L 430 680 L 500 680" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/></g><g id="step-3"><rect x="900" y="230" width="560" height="340" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="930" y="275" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start" >worker · 2 slots · 2 GiB · 2 CPUs · 128 PIDs</text><rect x="930" y="300" width="500" height="90" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="1180.0" y="338.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Claim job (compare-and-set)</text><text x="1180.0" y="364.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >attempt number fences stale work</text><rect x="930" y="410" width="500" height="130" rx="16" fill="#111827" stroke="#F59E0B" stroke-width="2"/><text x="1180.0" y="455.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Fresh parser child process</text><text x="1180.0" y="481.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >wall 60 s · CPU 30 s · 512 MiB · 32 MiB result</text><text x="1180.0" y="507.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle" >containment, not a sandbox</text><path d="M 740 290 L 900 290" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/><path d="M 740 400 L 900 400" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/><path d="M 740 510 L 900 510" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/></g><g id="step-4"><rect x="900" y="620" width="560" height="120" rx="16" fill="#111827" stroke="#2563EB" stroke-width="2"/><text x="1180.0" y="660.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >maintenance worker · 1 slot</text><text x="1180.0" y="687.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="middle" >re-queues lost jobs · resets stuck jobs</text><text x="1180.0" y="714.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="middle" >purges unpublished objects</text><path d="M 740 680 L 900 680" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" marker-end="url(#m-job)"/></g><g id="step-5"><rect x="1560" y="300" width="264" height="150" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="1692.0" y="355.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >PostgreSQL</text><text x="1692.0" y="384.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >job truth</text><text x="1692.0" y="413.0" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >atomic publish</text><rect x="1560" y="540" width="264" height="120" rx="16" fill="#111827" stroke="#1F2A3D" stroke-width="2"/><text x="1692.0" y="594.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Object storage</text><text x="1692.0" y="623.5" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#94A3B8" text-anchor="middle" >originals</text><path d="M 1460 350 L 1560 350" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-db)"/><path d="M 1460 500 L 1510 500 L 1510 600 L 1560 600" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-obj)"/></g><g id="step-6"><text x="900" y="800" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="start" >Task limits: documents soft 120 s / hard 180 s · crawls up to 3240 s / 3300 s</text><text x="900" y="835" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#F59E0B" text-anchor="start" >A killed job waits for the sweep: about 17 minutes with default settings</text></g><g id="legend"><line x1="96" y1="1000" x2="152" y2="1000" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 10"/><text x="166" y="1006" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" >Background job</text><line x1="322" y1="1000" x2="378" y2="1000" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><text x="392" y="1006" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" >Database transaction</text><line x1="602" y1="1000" x2="658" y2="1000" stroke="#A78BFA" stroke-width="4" stroke-linecap="round"/><text x="672" y="1006" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" >Private object storage</text></g>
